version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: leadbot-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: leadbot
      MYSQL_USER: leadbot
      MYSQL_PASSWORD: leadbot123
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - ./mysql-data:/var/lib/mysql
    command:
      [
        "mysqld",
        "--character-set-server=utf8mb4",
        "--collation-server=utf8mb4_general_ci"
      ]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    build:
      context: ../backend/source/leadbot-backend
      dockerfile: Dockerfile
    container_name: leadbot-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/leadbot?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8
      SPRING_DATASOURCE_USERNAME: leadbot
      SPRING_DATASOURCE_PASSWORD: leadbot123
      JWT_SECRET: replace-with-your-real-jwt-secret
      TZ: Asia/Shanghai
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ../frontend/source/leadbot-vue
      dockerfile: Dockerfile
    container_name: leadbot-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
