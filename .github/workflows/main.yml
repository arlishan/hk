name: 自动运行 Python 脚本
on:
  push:  # 每次上传/推送代码时触发
    branches: [main]  # 仅在 main 分支推送时触发
  workflow_dispatch:  # 允许手动触发

jobs:
  run-script:
    runs-on: ubuntu-latest  # 运行环境（Linux）
    steps:
      # 1. 拉取仓库代码到运行环境
      - name: 检出代码
        uses: actions/checkout@v4

      # 2. 配置 Python 环境（根据你的代码调整版本，比如 3.9）
      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # 3. 安装依赖（如果有 requirements.txt）
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # 4. 运行代码（替换为你的脚本名）
      - name: 执行脚本
        run: |
          python main.py
